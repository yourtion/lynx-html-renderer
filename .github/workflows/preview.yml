name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - "**"
      - "!gh-pages"
  workflow_dispatch:

# 取消同一 PR 的旧部署运行，避免资源浪费
# 清理任务不会被取消
concurrency:
  group: pr-preview-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  actions: read
  deployments: read

jobs:
  # 部署预览环境
  deploy-preview:
    # PR 关闭时不部署，仅清理
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: Vercel
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-version: "63.1.0"
          vercel-args: "--yes"
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL.trim();
            if (!previewUrl) {
              throw new Error('Vercel did not return a preview URL');
            }
            const prNumber = context.payload.pull_request.number;

            // 生成二维码指向实际的 bundle 文件（用于 LynxExplorer 扫码预览）
            const bundle = new URL('/index.lynx.bundle', previewUrl);
            bundle.searchParams.set('fullscreen', 'true');
            const bundleUrl = bundle.href;
            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(bundleUrl)}`;

            const comment = `## 🚀 Preview Deployment Ready!

            **Preview URL:** ${previewUrl}

            ### 📱 Scan to preview on mobile:
            ![QR Code](${qrCodeUrl})

            **Bundle URL:** \`${bundleUrl}\`

            <sub>This preview will be automatically updated when you push new commits to this PR.</sub>
            <sub>Deployment will be automatically removed when the PR is closed.</sub>`;

            // 查找现有评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Preview Deployment Ready')
            );

            if (botComment) {
              // 更新现有评论
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // 创建新评论
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }

  # 清理预览环境
  cleanup-preview:
    # 仅在 PR 关闭时运行
    if: github.event.action == 'closed'
    environment: Vercel
    runs-on: ubuntu-latest
    # 清理任务使用独立的并发组，不会被取消
    concurrency:
      group: pr-preview-cleanup-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove Vercel Preview Deployment
        uses: amondnet/vercel-action@v25
        with:
          vercel-version: "63.1.0"
          vercel-args: "--yes"
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
